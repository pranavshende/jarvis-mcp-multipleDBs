openapi: 3.0.3
info:
  title: MSC WMS API
  version: 1.4.0
  description: Read-only API for the WMS. All timestamps UTC.
servers:
  - url: https://wms.meridiansc.com/api/v1
security:
  - BearerAuth: []
paths:
  /items:
    get:
      summary: List WMS items
      responses:
        '200': {description: OK}
  /items/{item_id}:
    get:
      summary: Get item
      responses:
        '200': {description: OK}
  /stock:
    get:
      summary: Stock levels by item and warehouse
      responses:
        '200': {description: OK}
  /stock/{item_id}:
    get:
      summary: Stock for one item
      responses:
        '200': {description: OK}
  /inbound:
    get:
      summary: Inbound packages (filter by received_from/received_to, UTC)
      responses:
        '200': {description: OK}
  /inbound/{package_id}:
    get:
      summary: Package with lines
      responses:
        '200': {description: OK}
  /inbound/{package_id}/lines:
    get:
      summary: Package lines
      responses:
        '200': {description: OK}
  /outbound:
    get:
      summary: Outbound shipments
      responses:
        '200': {description: OK}
  /outbound/{shipment_id}:
    get:
      summary: Shipment
      responses:
        '200': {description: OK}
  /warehouses:
    get:
      summary: Warehouses
      responses:
        '200': {description: OK}
  /dashboards/receiving-by-day:
    get:
      summary: Packages received per day per warehouse (grouped by UTC date)
      responses:
        '200': {description: OK}
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: wms-read token (scopes items:read stock:read inbound:read)
